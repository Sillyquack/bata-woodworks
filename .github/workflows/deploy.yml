name: Deploy Bata Woodworks to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SHOWROOM_ONLY: ${{ vars.VITE_SHOWROOM_ONLY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PRIVACY_VERSION: ${{ vars.VITE_PRIVACY_VERSION }}
      VITE_REQUEST_INTAKE_OPEN: ${{ vars.VITE_REQUEST_INTAKE_OPEN }}
      LEGAL_TRADING_ENABLED: ${{ vars.LEGAL_TRADING_ENABLED }}
      REQUEST_INTAKE_OPEN: ${{ vars.REQUEST_INTAKE_OPEN }}
      PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
      VIPPS_LIVE_ENABLED: ${{ vars.VIPPS_LIVE_ENABLED }}
      ALLOW_MOCK_PAYMENTS: ${{ vars.ALLOW_MOCK_PAYMENTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate production configuration
        run: npm run check:production-config

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --get 'https://api.indexnow.org/indexnow' \
            --data-urlencode 'url=https://batawoodworks.no/' \
            --data-urlencode 'key=7541721d47ee4040ec98be84279def1a'
